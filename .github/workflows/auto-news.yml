name: Otomatik Haber Paylaşımı

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Bağımlılıkları yükle
        run: npm install --no-audit --no-fund

      - name: Kod kontrolü
        run: npm run check && npm test

      - name: Haberleri tara ve paylaş
        run: npm start
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '2' }}
          INCLUDE_SOURCE_LINK: ${{ vars.INCLUDE_SOURCE_LINK || 'false' }}
          SOURCE_NAMES: ${{ vars.SOURCE_NAMES }}

            - name: Tekrar kontrolü verisini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            cp data/seen.json /tmp/local-seen.json

            git fetch origin main
            git reset --hard origin/main

            node --input-type=module <<'NODE'
          import fs from "node:fs";

          const remoteState = JSON.parse(
            fs.readFileSync("data/seen.json", "utf8")
          );

          const localState = JSON.parse(
            fs.readFileSync("/tmp/local-seen.json", "utf8")
          );

          const mergedState = {
            initialized: Boolean(
              remoteState.initialized || localState.initialized
            ),
            seenUrls: [
              ...new Set([
                ...(remoteState.seenUrls || []),
                ...(localState.seenUrls || [])
              ])
            ],
            seenTexts: [
              ...new Set([
                ...(remoteState.seenTexts || []),
                ...(localState.seenTexts || [])
              ])
            ]
          };

          fs.writeFileSync(
            "data/seen.json",
            JSON.stringify(mergedState, null, 2) + "\n"
          );
          NODE

            if git diff --quiet -- data/seen.json; then
              echo "Kaydedilecek yeni durum yok."
              exit 0
            fi

            git add data/seen.json
            git commit -m "Haber tekrar kontrolü verisini güncelle"

            if git push origin HEAD:main; then
              echo "Durum verisi başarıyla kaydedildi."
              exit 0
            fi

            echo "Push çakıştı. Yeniden deneniyor: $attempt/3"
          done

          echo "Durum verisi üç denemede kaydedilemedi."
          exit 1
